[package]
name = "lmrust"
version = "0.1.2"
edition = "2021"
rust-version = "1.79"
license = "MIT"
description = "Rust SDK for lmapi: cli.schema.v1 validation, input forms, CLI server runtime and module store"
repository = "https://github.com/lmctl-ai/lmrust"
readme = "README.md"
keywords = ["cli", "schema", "llm", "validation", "lmapi"]
categories = ["command-line-interface", "development-tools"]
exclude = ["/.github", "/durable-memory"]

[lib]
name = "lmrust"
path = "src/lib.rs"

[features]
default = ["preserve_order"]
# Insertion-ordered JSON objects (serde_json/preserve_order), like JavaScript objects in lmts.
# Cargo unifies features, so this also switches serde_json in the embedding binary to
# insertion order; a binary that prints serde_json::Value and relies on sorted keys depends on
# lmrust with `default-features = false`.
preserve_order = ["serde_json/preserve_order"]
# Module store (@owner/repo schema cache): HTTPS fetcher (ureq + rustls) and sha256.
modules = ["dep:ureq", "dep:sha2"]

[dependencies]
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.117"
regex-lite = "0.1.6"
ureq = { version = "2.10", default-features = false, features = ["tls"], optional = true }
sha2 = { version = "0.10.8", optional = true }

[dev-dependencies]

[[example]]
name = "minitool"
path = "examples/minitool.rs"
